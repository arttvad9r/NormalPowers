name: tests

on:
  push:
  pull_request:

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile plugin
        run: python -m py_compile .hermes-plugin/__init__.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
